---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-client
  labels:
    death-star-project: hotel-res
    app: hr-client
spec:
  replicas: 1
  selector:
    matchLabels:
      death-star-project: hotel-res
      app: hr-client
  template:
    metadata:
      labels: 
        death-star-project: hotel-res
        app: hr-client
      name: hr-client
#      annotations:
#        sidecar.istio.io/inject: "true"
    spec:
      volumes:
        - name: log-share`
          emptyDir: {}
      containers:
      - name: hr-client
        image: yugm2/hr-client-k6:latest
        volumeMounts:
          - mountPath: /cilantrologs/
            name: log-share
        command:  ["/bin/sh", "-c"]
        args:
          - python /driver/k6_runscript.py --k6-logdir /cilantrologs/ --k6-qps 100 --k6-duration 30 --k6-url http://frontend.default.svc.cluster.local:5000
        imagePullPolicy: Always
      - name: cilantro-hr-client-k6
        image: yugm2/cilantroym:latest
        volumeMounts:
          - mountPath: /cilantrologs/
            name: log-share
        command: ["/bin/sh", "-c"]
        args:
          - python /cilantro/cilantro_clients/drivers/k6_to_grpc_driver.py --log-folder-path /cilantrologs/ --grpc-port $(CILANTRO_SERVICE_SERVICE_PORT) --grpc-ip $(CILANTRO_SERVICE_SERVICE_HOST) --grpc-client-id hr-client --poll-frequency 1
        imagePullPolicy: Always

